调。",effects:["易漏品类由 AI 按场景提醒，清单不再靠人背模板。","一句场景描述替代逐项拆词搜索，确认即可下单申请。","规格与场地条件在追问中确认，降低买错重购。"]}},{id:"S2",name:"型号绑定的物资怕买错",tag:"匹配得上",kw:"型号绑定",card:"防汛沙袋、潜水泵、匹配现场电梯型号的专用润滑油——型号错了就是废品，可型号参数采购人自己说不全。",story:{who:"汛期前，项目工程主管正在为地下车库配防汛应急物资包，顺带补电梯保养用的专用润滑油。",stuck:"沙袋尺寸、水泵口径他还记得，但润滑油必须匹配现场电梯型号，他记不全型号参数；搜索框里输入「电梯润滑油」出来几百种，不敢下单。",consequences:["型号参数说不全，只能翻维保合同或问工程师，一来一回好几天。","搜出一堆商品不敢挑，买错型号退货浪费预算。","应急物资窗口期短，等确认完汛期已经到了。"]},solution:{who:"他对 AI 导购说：配一批地下车库防汛应急物资，另外要匹配现场电梯型号的专用润滑油。",smooth:"AI 追问电梯型号、水泵口径等关键参数，按型号在可售目录里检索并写清匹配依据，清单每项都答得出「为什么匹配」。",effects:["关键参数由 AI 追问补齐，不用翻合同问工程师。","检索按型号过滤并给出匹配理由，买错型号的风险降到最低。","一次对话配齐全套应急物资，赶在汛期前到货。"]}},{id:"S3",name:"新团队到岗按标准配齐",tag:"算得清",kw:"数量预算",card:"新入职 5 人客服团队要配齐办公用品，单人标准 800 元——总数、预算归属、开票项目，采购人要自己算清楚。",story:{who:"客服部门新入职 5 名员工下周到岗，行政专员正在按入职标准配齐办公用品。",stuck:"工位椅、电脑外设、文具按单人标准 800 元配，总预算多少、走哪个项目的成本中心，她要自己拿计算器算，还要逐项核对商品在不在本项目可用目录里。",consequences:["数量乘单价再对标准，全靠人工核算，算错预算就被审批退回。","逐项核对商品是否在本项目可见目录内，费时且容易漏。","发票项目与预算科目对不上，报销被财务退回。"]},solution:{who:"她对 AI 导购说：新入职 5 人客服团队配齐办公用品，单人标准 800 元以内，走保利天悦项目成本中心。",smooth:"AI 自动换算总预算上限 4000 元并挂到对应成本中心，只在该项目可见目录内组清单，超预算前主动提醒。",effects:["预算换算由 AI 完成，总价上限自动带入采购条件。","目录范围自动过滤，清单内商品均该项目可采。","清单挂对预算归属，报销口径一次对齐。"]}},{id:"S4",name:"复杂条件拆不成关键词",tag:"说得出",kw:"条件组合",card:"「单价 50 元以内、夏季、透气款的保安制服」——一句话里价格、季节、款式全有，关键词搜索却只能一个条件一个条件试。",story:{who:"保安队长要为夏季换装采购一批透气款保安制服，单价控制在 50 元以内。",stuck:"「50 元以内、夏季、透气款」三个条件挤在一句话里，搜索框一次只能试一个词，改来改去结果不是超价就是不透气。",consequences:["多条件需求拆成多次搜索，反复调整关键词。","搜到的商品要逐个点开核对价格与款式。","不会拆词的采购人直接放弃线上搜索，转线下问人。"]},solution:{who:"他对 AI 导购说：单价 50 元以内、夏季、透气款的保安制服，要 200 套。",smooth:"AI 一句话解析出品类、预算、季节场景、款式要求与数量，自动换算总价上限 1 万元，直接给出符合全部条件的清单。",effects:["一句话完成条件组合，不用逐个试关键词。","清单先过全部条件再展示，不用逐个点开核对。","不会拆词的采购人也能自助完成采购检索。"]}}],Zv=[{id:"C1",name:"推荐数字必须来自检索原值",kw:"防幻觉",card:"大模型会「顺嘴编」价格库存。规矩：模型只组织语言，价格、库存、协议价全部代码层回填系统原值。",reality:"大模型生成文本时会编造看起来合理的数字，价格错一角都是采购事故。",decision:"模型只组织语言不产生数字：推荐卡上的价格、库存、协议价由代码层校验后回填检索原值，模型输出不含自造数字。",land:"05 生成清单时每个数字回填自 04 检索原值并留痕（chat_rec_card.source_values），模型不可改写（PRD FR-6/AC-8）。"},{id:"C2",name:"预算与合规校验优先",kw:"预算合规",card:"集采强依赖项目预算池与目录边界。清单生成时先校验预算余量与目录边界，超限提示风险、目录外直接拦截。",reality:"AI 若只顾「推荐得好」，超预算或目录外商品进了清单，采购申请会在审批环节被退回，白忙一场。",decision:"生成清单前先校验项目预算余量与目录边界：超限主动提示风险并建议替换，目录外商品不进清单；集团统一招标的集采协议内商品优先推荐并在理由中注明。",land:"05 生成清单时预算对照项目余量、目录对照可见范围，协议商品带协议标签排序靠前（04 检索先行过滤目录与权限）。"},{id:"C3",name:"克制的助手：不代客下单",kw:"域内克制",card:"对话式界面容易让用户期待「全托管」。定位：推荐到加购为止，下单回交易域走既有审批流，域外问题礼貌拒答。",reality:"工具代下单出了错说不清责任；闲聊问答还会把成本烧在无关调用上。",decision:"对话只到清单与加购为止，下单回交易域走既有审批；域外问题礼貌拒答并引导回商品采购域。",land:"06 确认·加购后流程交回交易系统，对话域不留下单闭环（PRD N1/N2）。"},{id:"C4",name:"成本与时延可控",kw:"成本时延",card:"大模型按次计费，全链路都走模型成本不可控。一次对话最多两次模型调用，超时降级无理由纯列表。",reality:"解析、追问、组织推荐若每步都调模型，按次成本随会话轮次放大，时延也叠加。",decision:"解析与推荐组织两次模型调用为上限；模型服务超时降级为无理由纯列表，结果仍可看可加购。",land:"02 解析与 05 组织推荐各一次调用（实测口径 1.1s/2.4s）；超时走异常兜底降级路径（MVP-2 已验证）。"}],Lv=JSON.parse('{"width":1360,"height":970,"lanes":[{"label":"采购人 · 需求人","tone":"biz","note":"说需求 → 审清单 → 提交申请","top":0,"height":134},{"label":"商城对话界面","tone":"biz","note":"双模式入口 · 会话留痕","top":160,"height":166},{"label":"AI 导购智能体","tone":"ai","note":"理解 → 澄清 → 组清单 · 不产生数字","top":352,"height":134},{"label":"搜索与商品中台","tone":"mid","note":"检索原值出数","top":512,"height":116},{"label":"商品 · 目录 · 权限中心","tone":"base","note":"身份 · 项目预算 · 目录规则 · 原值 · 协议 · 偏好","top":654,"height":158},{"label":"人工客服 · 商城运营","tone":"biz","note":"没听懂不瞎猜 · 兜底有出路","top":838,"height":116}],"nodes":[{"id":"u1","laneIndex":0,"w":170,"x":133,"y":16,"no":"01","title":"一句话说出采购需求","sub":"场景 + 条件 + 数量，不用拆关键词","aip":"（用户动作，无功能编号）","solves":[{"ref":"S1","how":"行政专员一句话说出活动场景，物料品类交给 AI 追问补齐。"},{"ref":"S2","how":"工程主管说出现场与电梯型号线索，参数缺口留给追问。"},{"ref":"S3","how":"说出人数与单人标准，数量换算交给 AI。"},{"ref":"S4","how":"三个条件一句话说完，不逐个试关键词。"}],"legacy":"以前采购人要把需求翻译成搜索关键词：一次一个词、翻页筛选，复杂条件靠自己拆。","whyAi":"关键词表达不了「场景+条件+数量」混在一句话里的需求，拆不好词的人直接搜不到或零结果。","humanRole":"采购人从「拆词的人」变成「说需求的人」：说清场景与底线条件即可。","risks":[{"risk":"采购人说出域外需求或闲聊","guard":"礼貌拒答并引导回商品采购域（PRD N2）。"}],"fallback":"输入不可理解时明确说「没听懂」并给示例，不瞎猜（PRD AC-E1）。","metrics":[{"m":"首轮表达完成率","v":"目标：一句话即可进入解析（对标行业对话导购）"}],"trace":["采购人 · 需求人","商城前端 · 对话输入框","chat_session / chat_turn 留痕"],"ai":"AI 在这一步只做「听」：完整接收自然语言原话，不强制表单字段，不要求懂类目体系。","process":["采购人用一句话说出场景与条件（如「下月售楼处开放，要一批营销物料，保利天悦项目用」）。","可顺带补充预算上限、数量、期望到货时间。","表达不完整没关系，缺的条件由后续追问补齐。"],"highlights":["不要求拆关键词、不要求懂类目体系，零门槛表达","场景原话直接进入解析与会话留痕"],"beforeAfter":[{"dim":"需求表达","before":"逐个关键词搜索、反复换词（示意）","after":"一句话说清场景与条件"}],"h":108},{"id":"g1","laneIndex":2,"w":175,"x":130,"y":377,"no":"02","title":"解析需求五要素","sub":"品类 · 场景 · 预算 · 规格 · 品牌","aip":"AIP-025","solves":[{"ref":"S3","how":"解析「5 人 × 单人标准 800 元」并自动换算总预算上限 4000 元（示意）。"},{"ref":"S4","how":"一句话里的价格、季节、款式条件一次解析成结构化字段，不用逐个试词。"}],"legacy":"以前靠采购人自己拆：类目要懂、规格要查、总价要拿计算器算，拆错就搜偏。","whyAi":"五要素混在一句话里，关键词检索天然拆不开；需求解析 MVP-1 实测 1.1s 完成结构化（PRD §6.2）。","humanRole":"采购人不再翻译需求；解析结果回显在对话里，他只纠错不拆词。","risks":[{"risk":"解析出错或漏要素","guard":"解析结果回显采购人确认，关键字段缺失走追问而不是猜。"}],"fallback":"需求不可理解时明确说「没听懂」并给示例，禁止瞎猜推荐（PRD FR-2/AC-E1）。","metrics":[{"m":"解析耗时","v":"实测 1.1s（MVP-1 口径）"},{"m":"解析准确率","v":"评测集 500+ 对话标注口径（PRD §7）"}],"trace":["AIP-025 需求解析","采购需求解析 MVP-1","chat_turn.parse 结构化留痕"],"ai":"把自然语言拆成品类、场景、预算、规格、品牌五个字段；听到「200 套单价 50 以内」时自动换算总价上限并带入检索，听不懂就明说。","process":["拆解品类 / 场景 / 预算 / 规格 / 品牌五要素。","「200 套单价 50 元以内」自动换算总价上限 1 万元（示意）并带入检索条件。","解析结果与依据回显给采购人确认。"],"highlights":["五要素 + 数量换算一次完成","解析留痕（chat_turn.parse），可复盘可评测"],"beforeAfter":[{"dim":"需求拆解","before":"人工拆词 + 计算器核价（示意）","after":"五要素自动解析、总价自动换算（实测 1.1s）"}],"h":90},{"id":"gx","laneIndex":2,"w":88,"x":508,"y":393,"kind":"diamond","title":"需求完整？","solves":[{"ref":"S2","how":"型号、口径等关键参数缺失时判「不完整」，宁可追问不瞎猜。"}],"legacy":"以前需求要素全不全没人检查，搜出来一堆再人工筛。","whyAi":"参数缺口（电梯型号、水泵口径）人工最容易漏，AI 按品类模板逐项核对。","humanRole":"采购人按提示补一两句即可，不用自查要素清单。","risks":[{"risk":"完备标准配得过严，句句追问惹人烦","guard":"只追问影响检索命中与合规的关键字段，其余缺省。"}],"fallback":"判断不了时按不完整处理，走追问确认。","metrics":[{"m":"追问触发率","v":"运营观测（按品类模板统计）"}],"trace":["AIP-025 解析完备性检查","品类关键参数模板","gx→g3 追问 / gx→s1 检索分流"],"ai":"对照品类参数模板检查五要素与关键参数：缺什么标记出来交给追问，齐备就直接进检索。","process":["对照品类模板核对五要素与关键参数。","缺关键字段转入多轮澄清；齐备直接进入检索。"],"highlights":["宁 {"id":"e-f09-d02","from":"f09","to":"d02","style":"dash","label":"候选回流，人审后才进正源","route":[[130,562],[120,562],[120,274],[330,274],[330,230]],"labelAt":[147,257]}],"dataSupport":"数据支撑｜在管商品 189,211 条全量纳管〔实测〕→ 01　／　Milvus 176,074 全量向量〔实测〕→ 向量投影　／　质量门禁：不过不投影 → 03　／　SOW 表 13 验收基线（关键属性≥85%/类目首选≥80%/同款 P≥85%/搜索前三≥95%）→ 评测集"}'),oy=[{dim:"人力",icon:"人",before:"对数靠人工通宵、口径之争靠开会、回流数据没人消费——数据工作全靠人盯",after:"正源一处定义，门禁拦住脏批次，回流先过人审——人只处理告警与审核"},{dim:"金钱",icon:"¥",before:"三台各建管道/词库/评测，预算与工期翻倍（示意）；同一商品被重复 Embedding 成本乘三（示意）",after:"一次建设三台复用；向量算一次三处用；词库越长 AI 调用越少（示意）"},{dim:"时间",icon:"⏱",before:"报表汇出以天计；索引同步滞后数日；事故后才发现质量滑坡",after:"每天对账查投影还在不在；嵌向量按需重跑；体检页看门禁"},{dim:"数据",icon:"库",before:"数据散落口径打架、资产各建各的、出域无闸门——数据是负担不是资产",after:"单一正源+四资产+安全闸门+飞轮——数据成为越用越厚、不出内网的平台资产"}],uy="口径说明：页内数字为项目已验证值（〔实测〕）或示意值（标注「示意」）；验收基线对齐 SOW 表 13（关键属性≥85% / 普通≥75% / 类目首选≥80% / 前三≥85% / 同款 P≥85%·R≥80% / 搜索前三≥95%·前十≥85% / 客服标准问答≥85%·高风险 100%）。",ry={id:Wv,platform:ey,title:ty,subtitle:ny,scenarios:ly,constraints:ay,flow:iy,compare:oy,metricNote:uy},sy="ai-recommend",cy="搜索",fy="AI 猜你喜欢 · 场景融合演示",dy="围绕单位常购、相似商品与关联品类三个推荐场景，展示 AI 猜你喜欢如何在采购资格约束下完成召回、去重、排序、理由展示与反馈评估。",hy=[{id:"S1",name:"常买的东西，还得重新找",tag:"单位常购",kw:"复购",card:"月底整理补货单，常买的手套、护目镜就在历史订单里，采购人员却还是得重新搜、逐条核对规格。",story:{who:"月底，采购人员打开工作台，准备补齐本单位的常购品。",stuck:"他记得上次买过劳保手套，也记得大概的规格，却想不起具体 SKU 藏在哪张订单里。工作台如果只给全站热门榜，他还是得回到搜索框，从头找起。",consequences:["补货单上的商品要逐项重搜、核规格，时间花在找回旧订单上。","常买 SKU 藏在历史记录里，临时接手采购的人很难顺手找到。","新单位没有足够的历史订单时，系统也不能假装已经了解它的采购偏好。"]},solution:{who:"工作台优先展示本单位常买的品类和商品；买得有规律时，再提示大概什么时候该补货。新单位没有历史订单时，直接说明推荐来自哪里（例如类目热销），不假装了解它的采购偏好。",smooth:"采购打开页面，先看到有依据的“贵单位常购”清单，再结合本次项目和实际规格核对。个人行为数据不足时，不把单位统计包装成“系统懂你”。",effects:["常购品从历史订单走到工作台，减少反复翻旧单和重新搜索。","新接手的采购人员也能从本单位的常购记录入手，不必完全依赖口头交接。","历史不足时如实说明推荐来源，不用虚构的个人偏好填满推荐位。"]}},{id:"S2",name:"想比个相近款，还得来回翻页",tag:"相似商品",kw:"比选",card:"打开安全帽详情页后，采购人员想比较同规格或相近参数的备选商品，却还得返回结果页重新搜索。",story:{who:"采购人员点开一款安全帽或其他具体商品，正在核对规格、价格和供货条件。",stuck:"看完当前商品，他还想找一两款相近规格的商品放在一起比较；页面却没有可信的相似商品入口，只能退回搜索结果、换关键词，再逐个打开详情页。",consequences:["为了比较一两个关键规格，采购人员反复离开详情页、再回来定位。","同款或相近款分散在多个页面，规格差异不容易一眼看清。","如果推荐只因为标题相似、没核对关键属性，反而可能把不合适的商品带进比选清单。"]},solution:{who:"详情页以当前商品为起点，把同款的其他规格、关键参数相近的商品、写法不同但实际相近的商品找出来放在一起；自动排除当前商品和无权查看的商品。",smooth:"相似关系来自同款映射、标准属性和语义数据。推荐展示时说明具体依据，并保留有采购意义的规格、SKU 差异；资格和动态供货状态仍需按业务规则校验。",effects:["采购人员可以留在当前商品页查看有比较价值的备选项。","推荐理由能落到“同款关系”或具体属性匹配，而不是笼统地说“AI 觉得相似”。","去重只合并重复记录，不会把不同规格或可选 SKU 错误折叠掉。"]}},{id:"S3",name:"清单差一件，系统没给下一步",tag:"关联品类",kw:"关联采购",card:"购物车里已有劳保手套，采购人员想起可能还要配护目镜；零结果页却只显示“没有找到商品”，没有下一步提示。",story:{who:"采购人员正在收尾一张集中采购清单，或在检索某个商品时碰到了零结果。",stuck:"清单已经快齐了，他还得靠记忆回想有没有经常一起采购的品类；而搜索无结果时，页面也没有基于历史采购关系的备选提示，只能换词再搜。",consequences:["配套品类全靠人回忆，忙起来时容易忘记还有哪些项目需要确认。","为了补齐清单，采购人员又要换词搜索、切换页面，思路和操作被打断。","零结果页没有合理的下一步时，用户只能退出当前流程，或去其他地方继续找。"]},solution:{who:"购物车和零结果页会翻本单位过去的订单，看哪些品类经常一起买，据此给出搭配建议；只有订单里确实经常一起出现的搭配，才显示「贵单位采购这类商品时，也常采购……」这样的理由。",smooth:"「经常一起买」只是历史订单提供的线索，不代表这些商品必须成套购买。一起买的次数不够多时，这个推荐位直接不显示；如果展示的是热门商品，会明确说明这是热门推荐，而不是说成历史关联。",effects:["存在可靠历史关联时，采购人员可以在当前清单里顺手检查相关品类。","零结果页在有合适备选时提供继续浏览的路径，而不是只留下一个空状态。","统计证据不足时不乱推，避免把偶然同单说成必然搭配。"]}}],my=[{id:"C1",name:"采购资格必须先于排序校验",kw:"采购资格",fullTitle:"采购资格必须先于排序校验【目录·权限·供应条件】",card:"相关度高不代表可以采购。推荐必须先核对当前单位与项目的目录权限、供应商资质及适用的价格、库存和配送条件。",reality:"个性化推荐不能授权用户采购无权限商品；目录、项目、供应商、价格与库存状态由各自的业务权威数据源提供。",decision:"把采购资格作为排序前的硬约束。无权、禁采或不满足硬性条件的备选必须剔除；价格、库存等动态状态在进入采购操作时按业务规则再次校验。",land:"落地在采购规则过滤、目录与权限数据供给、供应商准入规则，以及加购或提交采购时的业务校验。"},{id:"C2",name:"推荐理由必须有证据并可追溯",kw:"可解释",fullTitle:"推荐理由必须有证据并可追溯【理由来源·策略版本】",card:"采购人员需要知道为什么看到某个商品。推荐理由必须能够对应真实的历史采购、商品属性匹配或品类关联证据，不能由模型随意编造。",reality:"单一排序分数不足以支持采购核对；发生异常时，还需要在实际实现范围内定位推荐请求使用的理由、规则与策略。",decision:"优先采用可验证的理由码，并让理由与实际命中的数据来源对应。记录实际展示结果和已实现的策略标识；不把尚未实现的信号贡献度分解或不可篡改日志写成既有能力。",land:"落地在推荐结果组装、理由渲染、曝光与点击日志，以及已实现的策略版本和调用记录。"},{id:"C3",name:"单位数据隔离与推荐公平",kw:"数据隔离",fullTitle:"单位数据隔离与推荐公平【单位边界·无竞价置顶】",card:"单位采购画像不得越权流转到其他单位；推荐排序应依据与采购目标相关的规则，不由竞价推广或未经授权的人工置顶决定。",reality:"正式需求明确不做跨单位推荐，并且不做竞价推广位；单位常购和关联统计必须尊重租户/单位的数据边界。",decision:"单位画像和品类搭配统计按单位范围隔离；权限在数据访问与备选过滤层落实。排序规则应可说明、可复核，人工干预需有授权与记录。",land:"落地在单位画像和搭配统计数据模型、数据访问权限、备选过滤、策略配置与审计记录。"},{id:"C4",name:"成本、时延与降级必须可控",kw:"可用性",fullTitle:"成本、时延与降级必须可控【预算·超时·兜底】",card:"推荐服务需要控制计算成本与响应时间。画像或模型服务超时、备选不足时，应按场景策略安全降级，不能拖垮搜索、购物车和采购主流程。",reality:"规则检索、统计关联、向量检索和外部模型调用的成本结构不同；不能在缺乏调用数据时宣称全流程零成本或已达到确定的节约比例。",decision:"按实际实现拆分调用和资源成本，先用可复用数据与确定性规则；为超时、数据不足和服务不可用定义兜底或隐藏策略，并用监控数据验证效果。",land:"落地在召回与排序服务、超时控制、兜底策略、调用预算、成本监控和效果评测。"}],py={width:1360,height:342,defaultSelected:"filter",autoLayout:!0,viewH:400,bizContext:"本页挂在搜索中台「猜你喜欢」：首页看本单位常购，详情页比相似商品，购物车和零结果页看经常一起买的品类。页面决定开哪一路；推荐不代替目录权限、审批和下单。",dataSupport:"数据支撑｜单位内历史订单 → 常购与搭配；商品标准属性与同款关系 → 相似商品；目录、权限、禁采与供应条件 → 排序前过滤。",lanes:[{label:"触发位",note:"页面决定开哪一路",tone:"biz",top:0,height:86},{label:"推荐引擎",note:"召回后先过滤再排序",tone:"mid",top:112,height:102},{label:"回流",note:"曝光和采购结果更新统计",tone:"ai",top:240,height:86}],chain:["home","org","similar","cat","filter","show","fb"],nodes:[{id:"home",no:"01",title:"首页 / 工作台",sub:"补货时先看本单位常购",kind:"normal",w:200,laneIndex:0,col:0,row:0,x:130,y:16,solves:[{ref:"S1",how:"打开工作台就带上当前单位，只为本单位常购准备入口，不猜测个人偏好。"},{ref:"C3",how:"请求带单位边界，后面的画像只读本单位订单。"}],ai:"识别采购人是在工作台补货，把当前单位交给单位常购这一路。",process:["确认入口是首页或工作台","读取当前单位与角色","只启用单位常购，不顺带打开另外两路"],highlights:["这个入口只回答「我们单位常买什么」"],h:60},{id:"detail",no:"02",title:"商品详情",sub:"以当前商品找可比较的相近款",kind:"normal",w:200,laneIndex:0,col:1,row:0,x:382,y:16,solves:[{ref:"S2",how:"人已经停在某一件商品上，从这里找同规格或参数相近的商品，不必退回搜索。"}],ai:"识别采购人正在看具体商品，把该商品交给相似商品这一路。",process:["确认入口是商品详情","以当前商品为锚点","只启用相似商品"],highlights:["比选留在当前商品页完成"],h:60},{id:"cartz",no:"03",title:"购物车 / 零结果",sub:"清单差一件，或搜索没有结果",kind:"normal",w:200,laneIndex:0,col:2,row:0,x:634,y:16,solves:[{ref:"S3",how:"购物车补配套、零结果找下一步，都只查本单位订单里经常一起买的品类。"}],ai:"识别采购人在收尾清单或遇到零结果，把当前品类交给关联品类这一路。",process:["确认入口是购物车或零结果页","带上当前清单或搜索词对应的品类","只启用关联品类"],highlights:["没有可靠搭配时这一路可以不展示"],h:60},{id:"org",no:"04",title:"单位常购",sub:"本单位高频品类与常购商品",kind:"normal",w:200,laneIndex:1,col:0,row:0,x:130,y:136,solves:[{ref:"S1",how:"用本单位历史订单整理常购商品和补货节奏；没有历史时标明是热门，不写成常购。"},{ref:"C3",how:"统计按单位分开，不把其他单位的订单当作这个单位的偏好。"}],ai:"只统计当前单位买过的品类和商品，按购买次数整理常购清单。",process:["汇总本单位历史订单中的高频品类和常购商品","有重复购买节奏时给出补货提示","历史不够时改为标明来源的热门，或隐藏该区"],highlights:["理由只能写「贵单位常购」，并且对得上本单位订单"],panelAip:"AIP-029",legacy:"补货靠人翻旧订单或凭记忆报 SKU。",whyAi:"订单里已经有本单位的购买次数，不必每次重新搜索。",humanRole:"采购人员核对规格和项目后再加入清单。",risks:[{risk:"新单位几乎没有历史订单",guard:"标明热门推荐，或不展示常购区。"}],fallback:"画像读不到时隐藏常购区，页面其余部分照常。",trace:["AIP-029：单位常购"],h:60},{id:"similar",no:"05",title:"相似商品",sub:"同款、参数相近、写法相近",kind:"normal",w:200,laneIndex:1,col:1,row:0,x:382,y:136,solves:[{ref:"S2",how:"用同款关系和关键参数找出能放在一起比的商品，保留不同规格，不把相近款折成一条。"}],ai:"从当前商品找出同款其他规格、参数相近和写法不同但实际相近的商品。",process:["排除当前商品本身","优先同款和标准属性，再用写法相近补充","无权商品不进入这路结果"],highlights:["推荐理由写明同款或哪一项参数相近"],panelAip:"AIP-030",legacy:"比规格要退回搜索，换关键词再逐个打开。",whyAi:"标准属性和同款关系能把可比的商品拢到当前页。",humanRole:"采购人员自己看规格、价格和供货条件。",risks:[{risk:"只因标题像就被当成相似",guard:"先对标准属性和同款关系，对不上就不展示这条理由。"}],fallback:"相近商品不够时隐藏相似区，不硬凑。",trace:["AIP-030：相似商品"],h:60},{id:"cat",no:"06",title:"关联品类",sub:"本单位订单里经常一起买",kind:"normal",w:200,laneIndex:1,col:2,row:0,x:634,y:136,solves:[{ref:"S3",how:"只用本单位订单里反复一起出现的品类做搭配提示；次数不够就不显示。"},{ref:"C3",how:"搭配统计带单位，不用别的单位的订单来给这个单位做推荐。"}],ai:"看本单位过去哪些品类经常出现在同一批采购里，用来提示可能还要补的一类。",process:["只统计本单位订单","一起买的次数不够则不展示","热门兜底必须标明是热门，不能写成历史搭配"],highlights:["搭配是线索，不是必须成套购买"],panelAip:"AIP-031",legacy:"配套全靠人回忆，零结果页只剩一句没找到。",whyAi:"历史订单里已经有反复一起采购的品类。",humanRole:"采购人员决定要不要把这一类加入本次清单。",risks:[{risk:"偶尔同单被说成固定搭配",guard:"次数不够不展示；热门单独标明。"}],fallback:"没有可靠搭配时隐藏该区，零结果页不编一条假关联。",trace:["AIP-031：关联品类"],h:60},{id:"filter",no:"07",title:"资格过滤与去重",sub:"无权、禁采先剔除，再去掉重复记录",kind:"highlight",w:210,laneIndex:1,col:3,row:0,x:886,y:128,solves:[{ref:"C1",how:"目录权限、禁采和硬性供应条件在排序前剔除；价格和库存在真正采购时再核一次。"},{ref:"C4",how:"某一路超时或结果不够时隐藏该区，不拖住搜索、购物车和采购提交。"},{ref:"C3",how:"过滤使用本单位的目录和权限，不把其他单位能买的商品带进来。"}],ai:"三路结果汇合后，先去掉无权、禁采和重复记录，再交给排序。",process:["合并这一页实际打开的那一路结果","剔除无权、禁采和不满足硬性条件的商品","重复记录合并，不同规格保留","超时或没有合格结果时隐藏对应区域"],highlights:["相关度高也不能越过采购资格"],panelAip:"采购资格",legacy:"点进详情或提交时才发现不能买。",whyAi:"推荐位如果先展示再拦截，采购人会以为系统在推销不能买的东西。",humanRole:"资格规则由采购和权限主数据维护，推荐只执行。",risks:[{r 拆散在多家供应商重复采购——订单分散、量不集中，阶梯价永远谈不下来","长期看，商城沉淀不出品类行情（价格带、同款价差），比价能力留在个人脑子里，人走了能力就带走了"]},solution:{who:"采购在谈判前直接在前台点「同款比价」——系统按 SPU 属性（品牌＋型号＋关键规格）把同款归成一簇（AIP-010）。",smooth:"写法先归一成标准规格 → SPU 属性一致即同一标准品 → 横向报价单自动拉出，按报价升序。",effects:["比价全覆盖、数据上桌——议价不再靠感觉","同款集中采购——量集中，阶梯价谈得下来","品类行情（价格带、同款价差）持续沉淀——比价能力留在系统里"]}}],$y=[{id:"C1",name:"AI 按次收费——不能全量用",kw:"钱",fullTitle:"AI 按次收费【不能全量用】",card:"大模型按调用次数计费，真金白银。约 19 万商品若全部交给 AI 处理，是最贵的路线——而供应商已经把大部分属性信息推过来了，字段已在手还全靠 AI，等于花冤枉钱。",reality:"大模型按调用次数计费，真金白银。约 19 万商品若全部交给 AI 处理，是最贵的路线——而供应商已经把大部分属性信息推过来了，字段已在手还全靠 AI，等于花冤枉钱。",decision:"三路分层——供应商推的直采（零成本）→ 写法不统一的词典归一（零成本）→ AI 只兜底真缺口（按需付费）。AI 调用量＝缺口数，供应商覆盖越好，账单越小。",land:"落地在环节 03「三路分层调度」（AIP-012）：AI 触发率≈10%（示意）——账单随供应商覆盖面缩小。"},{id:"C2",name:"属性模板买不到——只能自建",kw:"买不到",fullTitle:"属性模板买不到【只能自建】",card:"「哪个类目该有哪些属性、值长什么样」的模板，是标杆平台的核心商业机密——京东明确拒绝提供，震坤行只给了一部分。外购这条路走不通。",reality:"「哪个类目该有哪些属性、值长什么样」的模板，是标杆平台的核心商业机密——京东明确拒绝提供，震坤行只给了一部分。外购这条路走不通。",decision:"三源合流自建——从供应商推送的商品数据里反向自举（主力，数据在我们手里）＋ Shopify 公开挂载表（消费类快启）＋ 震坤行给的种子（校验基准）；AI 补出的属性经确认后反哺模板——模板随经营自然生长，不受制于任何平台。",land:"落地在环节 02「挂类目选模板」＋ ↺「反哺回环」（AIP-005/006）：模板从自己的推品和已确认的补抽里长，不外购。"},{id:"C3",name:"AI 会编属性——不能直接入库",kw:"可审",fullTitle:"AI 会编属性【不能直接入库】",card:"大模型读标题时可能编出该类目不该有的属性，或把值写成不能用的形态。不收口就入库，筛选器会被脏键脏值污染，运营不敢放行。",reality:"模型可能给阀门编「颜色」，或把压力写成一段话。编出来的格子一旦进筛选，采购按错属性也能筛到货。",decision:"只准填该类目模板上的格子；模板没有的键丢掉并记下；值按类型拧成数字、是否或文本，拧不成就丢。结构由代码收口，不信模型自由发挥。",land:"落地在环节 04「按模板抽取」：三道口一起做完，编出来的键进不了库。"}],Gy={width:1360,height:711,defaultSelected:"n3",lanes:[{label:"供应商系统",note:"业务入口｜字段已在手",tone:"biz",top:0,height:119},{label:"商品中台流水线",note:"挂类目→选模板",tone:"ai",top:145,height:116},{label:"AI 抽取 · 校验",note:"三路分层→按模板抽→检测→分流",tone:"ai",top:287,height:170},{label:"运营人审",note:"例外判卷·驳回回流",tone:"biz",top:483,height:120},{label:"前台消费 · 反哺",note:"价值兑现于 04 搜索发现 · 05 比价决策",tone:"base",top:629,height:66}],nodes:[{id:"n1",no:"01",title:"供应商推品",sub:"标题＋属性＋规格字段<br>（API 推送，字段已在手）",panelAip:"—（起点环节）",kind:"normal",w:150,legacy:"供应商已经把标题、属性和规格推过来了。以前要么当没看见、全靠人补，要么整包丢给大模型。",whyAi:"这一步不用 AI。字段先进入流水线，能直接用的后面不花钱。",humanRole:"对接按接口收包。人不在这里核规格。",solves:[{ref:"C1",how:"供应商推来的字段先用。能直接映射的不花大模型的钱，缺口才往后走"},{ref:"S1",how:"字段推来了但写法不成标准。三个场景的病根从这里开始，交给后面收成标准值"}],ai:"这个环节故意<b>不用 AI</b>。供应商已经把标题、属性和规格推过来了，先原样收进流水线。",process:["接口推送商品包：标题、属性、规格","原样进入分层，先看哪些字段能直接用"],highlights:["能用的字段先用，大模型不为已经推来的信息付钱"],beforeAfter:[{dim:"花钱",before:"字段在手里，却全靠人核或全量交给大模型",after:"字段先用，缺口才轮到大模型"}],laneIndex:0,x:143,y:16,h:93},{id:"n2",no:"02",title:"挂标准类目",sub:"先挂对类目，再套该类目<br>该填哪些属性",aip:"AIP-003/004",panelTitle:"挂标准类目 · 选模板",panelAip:"AIP-003/004 类目治理",kind:"normal",w:160,legacy:"运营对着一长串类目手工挑。挂错了，后面用错属性清单，筛选入口全错，老周按「阀门」永远找不到这件货。",whyAi:"挂对类目，才知道这件货该填通径还是容量。后面抽取和校验都靠这张清单。",humanRole:"没把握的件，人改类目后回流。不拿错类目往下抽。",fallback:"预测没把握就转人审，不把错类目的属性清单套上去。",solves:[{ref:"S1",how:"挂到「阀门 > 球阀」，老周才有这个筛选入口。挂错类目，等于用错属性清单，筛选入口全错"},{ref:"S2",how:"类目挂对了，后面校验才有正确的验收单：每张叶类目一份该填哪些属性"},{ref:"C2",how:"买不到的模板长在自己的类目上。类目是模板的挂载点"}],ai:"按标题<b>预测标准类目</b>。挂对才能取出该类目该填的属性。挂错了人改完回流。",process:["按标题挂到标准类目","取出该类目的属性清单，作为后面抽取和验收的范围"],highlights:["类目既是筛选入口，也是属性清单。挂错了，后面全白做"],beforeAfter:[{dim:"找货",before:"人凭经验挑类目，挂错了货在错误入口里隐身",after:"机器先挂，错了人改完回流"}],laneIndex:1,x:138,y:161,h:90},{id:"n3",no:"03",title:"三路分层调度",sub:"能用的先用 · 写法收成标准值<br>缺的才读标题补",aip:"AIP-012",panelTitle:"三路分层调度（核心）",panelAip:"AIP-012 属性自动提取",kind:"highlight",w:175,legacy:"字段已经在手里，却要么逐条人工核，要么十几万条全丢给大模型。前者跟不上推送，后者最贵，写法还是进不了筛选。",whyAi:"大部分属性供应商已经推来。能直接用的不花钱，写法不统一的用词典收成 DN65，只有标题里有、字段里没有的，才让大模型读标题补。",humanRole:"人不挑该走哪一路。路由自动。人只看后面拦下的例外。",fallback:"大模型这一路失败，这件不补属性，不拿编出来的值往下放。",solves:[{ref:"C1",how:"供应商已经推来且能用的直接收；词典能收的写法不调大模型。调用多少取决于缺口多少"},{ref:"S1",how:"「直径65」收成 DN65。字段从「有」变成「标准」，才进得了老周的筛选面板"},{ref:"S3",how:"规格收成同一写法之后，同款才有归并的键，报价单才拉得出来"}],ai:"大模型<b>只在第三路出手</b>。第一路：字段在且能用，直接收。第二路：写法不统一，词典收成标准值。第三路：标题里有、字段里没有，才读标题补。补出来的值交给下一环按模板收口。",process:["① 直收：字段在且合法，直接映射，不调用大模型","② 收写法：「直径65」「五百毫升」用词典收成 DN65、500ml，不调用大模型","③ 补缺口：字段缺失或过不了校验，才让大模型读标题补"],highlights:["能直接用的不花钱，采购按标准口径才筛得到","大模型只补缺口，供应商推得越全，账单越小"],beforeAfter:[{dim:"花钱",before:"约 19 万商品全量调用，最贵路线",after:"只调缺口≈10%（ 购和供应商互相追问状态","询比价记录散落于线下，复盘无据、审计困难","审批不联动 OA，纸质/线下流转拖慢定标"]},solution:{who:"PM 寻源管理发单、SUP 寻源响应在线报价、询比价与 OA 审批联动、SHOP 二次询价回到寻源。",smooth:"发单→在线响应→系统询比价→OA 审批定标——全程线上留痕，状态双方可见。",effects:["寻源全程线上化，进度双方实时可见","询比价记录系统留痕，复盘与审计有据","审批联动 OA，定标周期从周计压到日计（示意）"]}},{id:"S3",name:"商城交易体验断点",tag:"交易",kw:"断点",card:"B 端自营/撮合/转售与 C 端福利/业主多模式并存，AI 商品匹配能力不足；购物车到下单、心愿单到补货之间体验断点多。",story:{who:"采购单位与 C 端业主在商城下单，运营配置经营模式与商品展示。",stuck:"多模式交易规则复杂，找货靠翻目录；AI 商品匹配只覆盖部分场景，购物车、二次询价、心愿单各是信息孤岛。",consequences:["B 端下单模式切换繁琐，撮合/转售规则不透明","C 端业主福利选购无引导，转化低","心愿单缺货无到货提醒，二次询价入口找不到"]},solution:{who:"商城场景按 B 端三种模式＋C 端两类人群分流，AI 商品匹配导购贯穿选购，购物车/心愿单/二次询价连成下单链路。",smooth:"模式分流→AI 匹配导购→购物车/心愿单→下单/二次询价——选购到成交不断点。",effects:["B 端三模式下单路径清晰，撮合/转售规则页内说明","AI 导购把「找货」变「问货」，C 端福利转化提升（示意）","心愿单到货提醒、二次询价一键发起，断点接通"]}},{id:"S4",name:"履约对账靠人工",tag:"履约",kw:"对账",card:"订单履约状态靠人工同步，售后单与订单脱节；供应商与采购两头对账，翻单核对以周计，发票人工匹配。",story:{who:"供应商履约发货处理售后，采购跟踪订单并发起对账，财务核对发票。",stuck:"履约状态人工同步，售后与订单脱节；对账靠两头翻单核对，发票人工匹配订单，差异靠电话对齐。",consequences:["履约进度采购不可见，急单只能电话催","售后处理慢，纠纷升级影响供应商评级","对账周期以周计，差异争议消耗财务大量工时"]},solution:{who:"订单履约状态四端同步、售后单挂接订单、对账单系统生成双向核对、发票系统匹配订单。",smooth:"履约→售后→对账→发票系统串链——状态实时同步、账单机器核对、差异自动标注。",effects:["履约状态四端实时同步，采购自助查进度","售后挂接订单闭环处理，响应时效可考核","对账机器核对当日完成（示意），财务只审差异"]}},{id:"S5",name:"客服与知识不闭环",tag:"反哺",kw:"闭环",card:"客服高峰排队、夜间漏单、口径不一；会话里的高频问题和商品知识沉不下来，教不了 AI 也改不了类目模板。",story:{who:"采购/供应商/业主向客服咨询商品、订单、对账问题，运营想把这些知识用起来。",stuck:"高频问题重复解答占满人工；答案口径靠个人经验；会话结束后知识不回流，AI 商品匹配和类目模板得不到滋养。",consequences:["高峰排队、夜间漏单，咨询体验差","同一问题不同答案，口径不一致引发纠纷","知识不沉淀，AI 能力和模板规则停在初版"]},solution:{who:"AICS 在线智能体 7×24 承接高频咨询，低置信拒答留痕；会话评价回流知识库，巡检结果反哺类目模板。",smooth:"在线智能接待→拒答留痕→会话评价→知识库/模板反哺——客服越用越准、模板越用越厚。",effects:["高频问题秒级响应，答不了的拒答留痕","口径统一来自知识库，可追溯可审计","会话反哺知识库、巡检反哺模板，AI 持续进化"]}}],A2=[{id:"C1",name:"数据不出域——脱敏后走云端",kw:"不出域",fullTitle:"数据不出域【脱敏后走云端】",card:"商城商品、价格、供应商、订单数据是核心资产，绝不可出内网。SOW 约束一允许「私有化部署或脱敏网关」双路径；前期（ADR-014）不部署本地大模型——模型能力全部经脱敏网关调用云端，数据存储全内网。",reality:"商品、价格、供应商、交易数据一旦出域即是安全事故；不经脱敏裸调公有云大模型不可接受。",decision:"前期纯云端（ADR-014）：LiteLLM 网关统一调度云端大模型（GLM/Qwen 等，多 provider 互备），出域必经脱敏网关，敏感场景 fail-closed 拒绝；私有化留作后期再评估（云端账单超私有化 TCO 交叉点 / 强制本地推理合规 / UIE 蒸馏学生模型达标）。",land:"落地于集成层「模型网关 · 云端按次」节点——所有 AIP/AICS 能力调用的前置约束。"},{id:"C2",name:"AI 按次收费——不能全量用",kw:"钱",fullTitle:"AI 按次收费【不能全量用】",card:"大模型按调用次数计费。全量商品、全量咨询都交给 AI 是最贵路线——必须先分层，AI 只兜真缺口。",reality:"商品上架与咨询量随业务增长，全量调 AI 成本不可控（SOW 按功能条目计费之外，推理成本需自控）。",decision:"三路分层：规则能判的不调 AI、词典能归一的不调 AI、AI 只处理规则覆盖不了的缺口；触发率压到低位（示意）。",land:"落地于 AIP「AI 商品清洗审核」节点的分层调度——AI 调用量=缺口数，规则覆盖越好账单越小。"},{id:"C3",name:"AI 有幻觉风险——必须可审计",kw:"可审",fullTitle:"AI 有幻觉风险【必须可审计】",card:"大模型会一本正经地编造，直接采信就是事故。所有 AI 输出必须可追溯、可审计、有兜底校验。",reality:"AI 编造规格、编造价格、编造政策条款，采购/供应商采信即造成直接经济损失与纠纷。",decision:"Schema 约束输出、规则引擎校验、置信度分级、人审兜底；按 SOW 7.2 七项 AI 验收指标持续压测。",land:"落地于 AIP 清洗审核的人审例外与 AICS 强制口径——客服标准问题识别≥85%、强制口径≥88%（SOW 7.2）。本期客服只做在线 AI，人工客服后续再接。"},{id:"C4",name:"合同里程碑与验收红线",kw:"里程碑",fullTitle:"合同里程碑与验收红线【SOW 6/7/9 章】",card:"SOW 九章里程碑 9 项：2026-08-12 启动 → 2026-12-31 核心业务闭环试运行 → 2027-06-30 项目验收；咨询驻场 ≥2 人 × 1 年保障落地。",reality:"合同功能条目 372 项（SOW 3.2 节：OP-129 / PM-50 / SHOP-93 / SUP-40 / AIP-31 / AICS-29），范围变更必须走变更程序。",decision:"以 SOW 3.2 功能清单为基线；蓝图/PRD/详细设计逐级确认，不实质扩大或缩减范围；里程碑按 9 节点考核。",land:"落地于「咨询与驻场运营」节点——《业务流程与系统蓝图方案》等 4 项咨询成果 + 驻场服务是全部功能节点的交付保障。"}],S2=JSON.parse('{"width":1360,"height":2087,"autoLayout":true,"drill":true,"indexChain":["n2","n18","n13","n6","n11","n4","n12"],"defaultSelected":"n2","lanes":[{"label":"SUP 供应商端 · 40 项","top":0,"height":372},{"label":"SHOP 商城下单端 · 93 项","top":412,"height":270},{"label":"PM 采购管理端 · 50 项","top":722,"height":270},{"label":"OP 平台运营端 · 129 项","top":1032,"height":389},{"label":"双 AI 中台 · AIP 31 项 ＋ AICS 29 项","top":1461,"height":270},{"label":"集成层 · 合同 12 类集成","top":1771,"height":288}],"nodes":[{"id":"n1","no":"01","title":"供应商入驻建档","sub":"基本档案＋资质材料<br>创建/导入/接口同步","aip":"SUP-001~008","panelAip":"SUP-001~008 账号管理 / OP-007~010 供应商管理","kind":"normal","x":130,"y":28,"w":150,"laneIndex":0,"solves":[{"ref":"S1","how":"建档是推品前置：供应商档案与资质审核通过才有推品资格"},{"ref":"C4","how":"入驻流程按 SOW 3.2 基线执行，档案字段在蓝图阶段确认"}],"ai
