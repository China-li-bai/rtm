成 DN65 入筛选索引（AIP-012），前台自动聚合出通径/压力/材质筛选面板（AIP-018-020），同款直接拉横向报价（AIP-010）。",smooth:"写法归一成标准值 → 属性入筛选索引 → 筛选面板按类目逐层收窄——货从「隐身」变「一筛即中」。",effects:["不再问客服、翻协调员——筛选即找货，询价回到几分钟","急件在商城内闭环——GMV 与采购习惯留在自有商城","找货能力从个人货源表沉淀进系统，人换了不断档"]}},{id:"S2",name:"上架不敢全信",tag:"敢放行",kw:"不可信",card:"运营小李负责把供应商系统推来的商品放行上架。推来的数据质量参差——有的属性齐全，有的缺一半，偶有错填；全盘入库，脏数据就混进筛选体系，错一条就是采购事故。",story:{who:"运营小李负责把供应商系统推来的商品放行上架。",stuck:"推来的数据质量参差——有的商品属性齐全，有的缺一半；偶有错填（规格填进型号格、单位写错）。全盘入库，脏数据就混进筛选体系。",consequences:["若不校验直接放：客户按「DN65」筛出来的结果里混着 DN80——下单买错、工地装不上，退换货来回一周，还可能升级成供应商纠纷。工业品规格错一个就是采购事故","若不敢信逐条人工核：每天上百条新品，核对速度跟不上推送速度——供应商铺货意愿下降，商城 SKU 增长失速","两头堵的结局：运营只能「先上再说」，质量欠账越滚越大，商城筛选器的公信力被持续稀释——筛错的商品多几次，采购就再也不用这个筛选器了"]},solution:{who:"小李不再逐条核——推品自动走三路分层，机器按类目模板校验必填/值域/错填（AIP-013），通过的自动放行。",smooth:"校验不合法即拦截（DN80 混不进 DN65）；低置信自动转人审——人只看机器没把握的少数件；驳回原因自动回传供应商，下次推对。",effects:["脏数据进不了筛选体系——不再买错、不再退换一周、不再升级纠纷","核对速度跟上推送——当日分层当日放行，供应商铺货意愿不受挫","放行有统一判据（类目模板）——筛选器公信力不再被稀释"]}},{id:"S3",name:"同款无法归并",tag:"比得了",kw:"不归一",card:"采购做季度供应商谈判，要拿「304 不锈钢保温杯 500ml」的横向报价单去压价。A 写「五百毫升」、B 写「500ML」、C 写「大容量」——系统认不出这是同一规格，比价单拉不出来。",story:{who:"采购做季度供应商谈判，要拿「304 不锈钢保温杯 500ml」的横向报价单去压价。",stuck:"A 供应商写「五百毫升」、B 写「500ML」、C 写「大容量」——系统认不出这是同一规格，比价单拉不出来。",consequences:["采购只能人工逐条对标题、凭经验认同款——比价覆盖不全，谈判桌上拿不出数据，议价靠感觉","同款被拆散在多家供应商重复采购——订单分散、量不集中，阶梯价永远谈不下来","长期看，商城沉淀不出品类行情（价格带、同款价差），比价能力留在个人脑子里，人走了能力就带走了"]},solution:{who:"采购在谈判前直接在前台点「同款比价」——系统按 SPU 属性（品牌＋型号＋关键规格）把同款归成一簇（AIP-010）。",smooth:"写法先归一成标准规格 → SPU 属性一致即同一标准品 → 横向报价单自动拉出，按报价升序。",effects:["比价全覆盖、数据上桌——议价不再靠感觉","同款集中采购——量集中，阶梯价谈得下来","品类行情（价格带、同款价差）持续沉淀——比价能力留在系统里"]}}],M1=[{id:"C1",name:"AI 按次收费——不能全量用",kw:"钱",fullTitle:"AI 按次收费【不能全量用】",card:"大模型按调用次数计费，真金白银。约 19 万商品若全部交给 AI 处理，是最贵的路线——而供应商已经把大部分属性信息推过来了，字段已在手还全靠 AI，等于花冤枉钱。",reality:"大模型按调用次数计费，真金白银。约 19 万商品若全部交给 AI 处理，是最贵的路线——而供应商已经把大部分属性信息推过来了，字段已在手还全靠 AI，等于花冤枉钱。",decision:"三路分层——供应商推的直采（零成本）→ 写法不统一的词典归一（零成本）→ AI 只兜底真缺口（按需付费）。AI 调用量＝缺口数，供应商覆盖越好，账单越小。",land:"落地在环节 03「三路分层调度」（AIP-012）：AI 触发率≈10%（示意）——账单随供应商覆盖面缩小。"},{id:"C2",name:"属性模板买不到——只能自建",kw:"买不到",fullTitle:"属性模板买不到【只能自建】",card:"「哪个类目该有哪些属性、值长什么样」的模板，是标杆平台的核心商业机密——京东明确拒绝提供，震坤行只给了一部分。外购这条路走不通。",reality:"「哪个类目该有哪些属性、值长什么样」的模板，是标杆平台的核心商业机密——京东明确拒绝提供，震坤行只给了一部分。外购这条路走不通。",decision:"三源合流自建——从供应商推送的商品数据里反向自举（主力，数据在我们手里）＋ Shopify 公开挂载表（消费类快启）＋ 震坤行给的种子（校验基准）；AI 补出的属性经确认后反哺模板——模板随经营自然生长，不受制于任何平台。",land:"落地在环节 02「挂类目选模板」＋ ↺「反哺回环」（AIP-005/006）：自举曾产出 694 叶/1,182 行模板，Shopify 9.3 万条已入库。"}],U1={width:1360,height:560,defaultSelected:"n3",lanes:[{label:"供应商系统",top:14,height:98},{label:`商品中台
