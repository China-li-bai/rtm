调。",effects:["易漏品类由 AI 按场景提醒，清单不再靠人背模板。","一句场景描述替代逐项拆词搜索，确认即可下单申请。","规格与场地条件在追问中确认，降低买错重购。"]}},{id:"S2",name:"型号绑定的物资怕买错",tag:"匹配得上",kw:"型号绑定",card:"防汛沙袋、潜水泵、匹配现场电梯型号的专用润滑油——型号错了就是废品，可型号参数采购人自己说不全。",story:{who:"汛期前，项目工程主管正在为地下车库配防汛应急物资包，顺带补电梯保养用的专用润滑油。",stuck:"沙袋尺寸、水泵口径他还记得，但润滑油必须匹配现场电梯型号，他记不全型号参数；搜索框里输入「电梯润滑油」出来几百种，不敢下单。",consequences:["型号参数说不全，只能翻维保合同或问工程师，一来一回好几天。","搜出一堆商品不敢挑，买错型号退货浪费预算。","应急物资窗口期短，等确认完汛期已经到了。"]},solution:{who:"他对 AI 导购说：配一批地下车库防汛应急物资，另外要匹配现场电梯型号的专用润滑油。",smooth:"AI 追问电梯型号、水泵口径等关键参数，按型号在可售目录里检索并写清匹配依据，清单每项都答得出「为什么匹配」。",effects:["关键参数由 AI 追问补齐，不用翻合同问工程师。","检索按型号过滤并给出匹配理由，买错型号的风险降到最低。","一次对话配齐全套应急物资，赶在汛期前到货。"]}},{id:"S3",name:"新团队到岗按标准配齐",tag:"算得清",kw:"数量预算",card:"新入职 5 人客服团队要配齐办公用品，单人标准 800 元——总数、预算归属、开票项目，采购人要自己算清楚。",story:{who:"客服部门新入职 5 名员工下周到岗，行政专员正在按入职标准配齐办公用品。",stuck:"工位椅、电脑外设、文具按单人标准 800 元配，总预算多少、走哪个项目的成本中心，她要自己拿计算器算，还要逐项核对商品在不在本项目可用目录里。",consequences:["数量乘单价再对标准，全靠人工核算，算错预算就被审批退回。","逐项核对商品是否在本项目可见目录内，费时且容易漏。","发票项目与预算科目对不上，报销被财务退回。"]},solution:{who:"她对 AI 导购说：新入职 5 人客服团队配齐办公用品，单人标准 800 元以内，走保利天悦项目成本中心。",smooth:"AI 自动换算总预算上限 4000 元并挂到对应成本中心，只在该项目可见目录内组清单，超预算前主动提醒。",effects:["预算换算由 AI 完成，总价上限自动带入采购条件。","目录范围自动过滤，清单内商品均该项目可采。","清单挂对预算归属，报销口径一次对齐。"]}},{id:"S4",name:"复杂条件拆不成关键词",tag:"说得出",kw:"条件组合",card:"「单价 50 元以内、夏季、透气款的保安制服」——一句话里价格、季节、款式全有，关键词搜索却只能一个条件一个条件试。",story:{who:"保安队长要为夏季换装采购一批透气款保安制服，单价控制在 50 元以内。",stuck:"「50 元以内、夏季、透气款」三个条件挤在一句话里，搜索框一次只能试一个词，改来改去结果不是超价就是不透气。",consequences:["多条件需求拆成多次搜索，反复调整关键词。","搜到的商品要逐个点开核对价格与款式。","不会拆词的采购人直接放弃线上搜索，转线下问人。"]},solution:{who:"他对 AI 导购说：单价 50 元以内、夏季、透气款的保安制服，要 200 套。",smooth:"AI 一句话解析出品类、预算、季节场景、款式要求与数量，自动换算总价上限 1 万元，直接给出符合全部条件的清单。",effects:["一句话完成条件组合，不用逐个试关键词。","清单先过全部条件再展示，不用逐个点开核对。","不会拆词的采购人也能自助完成采购检索。"]}}],Lv=[{id:"C1",name:"推荐数字必须来自检索原值",kw:"防幻觉",card:"大模型会「顺嘴编」价格库存。规矩：模型只组织语言，价格、库存、协议价全部代码层回填系统原值。",reality:"大模型生成文本时会编造看起来合理的数字，价格错一角都是采购事故。",decision:"模型只组织语言不产生数字：推荐卡上的价格、库存、协议价由代码层校验后回填检索原值，模型输出不含自造数字。",land:"05 生成清单时每个数字回填自 04 检索原值并留痕（chat_rec_card.source_values），模型不可改写（PRD FR-6/AC-8）。"},{id:"C2",name:"预算与合规校验优先",kw:"预算合规",card:"集采强依赖项目预算池与目录边界。清单生成时先校验预算余量与目录边界，超限提示风险、目录外直接拦截。",reality:"AI 若只顾「推荐得好」，超预算或目录外商品进了清单，采购申请会在审批环节被退回，白忙一场。",decision:"生成清单前先校验项目预算余量与目录边界：超限主动提示风险并建议替换，目录外商品不进清单；集团统一招标的集采协议内商品优先推荐并在理由中注明。",land:"05 生成清单时预算对照项目余量、目录对照可见范围，协议商品带协议标签排序靠前（04 检索先行过滤目录与权限）。"},{id:"C3",name:"克制的助手：不代客下单",kw:"域内克制",card:"对话式界面容易让用户期待「全托管」。定位：推荐到加购为止，下单回交易域走既有审批流，域外问题礼貌拒答。",reality:"工具代下单出了错说不清责任；闲聊问答还会把成本烧在无关调用上。",decision:"对话只到清单与加购为止，下单回交易域走既有审批；域外问题礼貌拒答并引导回商品采购域。",land:"06 确认·加购后流程交回交易系统，对话域不留下单闭环（PRD N1/N2）。"},{id:"C4",name:"成本与时延可控",kw:"成本时延",card:"大模型按次计费，全链路都走模型成本不可控。一次对话最多两次模型调用，超时降级无理由纯列表。",reality:"解析、追问、组织推荐若每步都调模型，按次成本随会话轮次放大，时延也叠加。",decision:"解析与推荐组织两次模型调用为上限；模型服务超时降级为无理由纯列表，结果仍可看可加购。",land:"02 解析与 05 组织推荐各一次调用（实测口径 1.1s/2.4s）；超时走异常兜底降级路径（MVP-2 已验证）。"}],Zv=JSON.parse('{"width":1360,"height":970,"lanes":[{"label":"采购人 · 需求人","tone":"biz","note":"说需求 → 审清单 → 提交申请","top":0,"height":134},{"label":"商城对话界面","tone":"biz","note":"双模式入口 · 会话留痕","top":160,"height":166},{"label":"AI 导购智能体","tone":"ai","note":"理解 → 澄清 → 组清单 · 不产生数字","top":352,"height":134},{"label":"搜索与商品中台","tone":"mid","note":"检索原值出数","top":512,"height":116},{"label":"商品 · 目录 · 权限中心","tone":"base","note":"身份 · 项目预算 · 目录规则 · 原值 · 协议 · 偏好","top":654,"height":158},{"label":"人工客服 · 商城运营","tone":"biz","note":"没听懂不瞎猜 · 兜底有出路","top":838,"height":116}],"nodes":[{"id":"u1","laneIndex":0,"w":170,"x":133,"y":16,"no":"01","title":"一句话说出采购需求","sub":"场景 + 条件 + 数量，不用拆关键词","aip":"（用户动作，无功能编号）","solves":[{"ref":"S1","how":"行政专员一句话说出活动场景，物料品类交给 AI 追问补齐。"},{"ref":"S2","how":"工程主管说出现场与电梯型号线索，参数缺口留给追问。"},{"ref":"S3","how":"说出人数与单人标准，数量换算交给 AI。"},{"ref":"S4","how":"三个条件一句话说完，不逐个试关键词。"}],"legacy":"以前采购人要把需求翻译成搜索关键词：一次一个词、翻页筛选，复杂条件靠自己拆。","whyAi":"关键词表达不了「场景+条件+数量」混在一句话里的需求，拆不好词的人直接搜不到或零结果。","humanRole":"采购人从「拆词的人」变成「说需求的人」：说清场景与底线条件即可。","risks":[{"risk":"采购人说出域外需求或闲聊","guard":"礼貌拒答并引导回商品采购域（PRD N2）。"}],"fallback":"输入不可理解时明确说「没听懂」并给示例，不瞎猜（PRD AC-E1）。","metrics":[{"m":"首轮表达完成率","v":"目标：一句话即可进入解析（对标行业对话导购）"}],"trace":["采购人 · 需求人","商城前端 · 对话输入框","chat_session / chat_turn 留痕"],"ai":"AI 在这一步只做「听」：完整接收自然语言原话，不强制表单字段，不要求懂类目体系。","process":["采购人用一句话说出场景与条件（如「下月售楼处开放，要一批营销物料，保利天悦项目用」）。","可顺带补充预算上限、数量、期望到货时间。","表达不完整没关系，缺的条件由后续追问补齐。"],"highlights":["不要求拆关键词、不要求懂类目体系，零门槛表达","场景原话直接进入解析与会话留痕"],"beforeAfter":[{"dim":"需求表达","before":"逐个关键词搜索、反复换词（示意）","after":"一句话说清场景与条件"}],"h":108},{"id":"g1","laneIndex":2,"w":175,"x":130,"y":377,"no":"02","title":"解析需求五要素","sub":"品类 · 场景 · 预算 · 规格 · 品牌","aip":"AIP-025","solves":[{"ref":"S3","how":"解析「5 人 × 单人标准 800 元」并自动换算总预算上限 4000 元（示意）。"},{"ref":"S4","how":"一句话里的价格、季节、款式条件一次解析成结构化字段，不用逐个试词。"}],"legacy":"以前靠采购人自己拆：类目要懂、规格要查、总价要拿计算器算，拆错就搜偏。","whyAi":"五要素混在一句话里，关键词检索天然拆不开；需求解析 MVP-1 实测 1.1s 完成结构化（PRD §6.2）。","humanRole":"采购人不再翻译需求；解析结果回显在对话里，他只纠错不拆词。","risks":[{"risk":"解析出错或漏要素","guard":"解析结果回显采购人确认，关键字段缺失走追问而不是猜。"}],"fallback":"需求不可理解时明确说「没听懂」并给示例，禁止瞎猜推荐（PRD FR-2/AC-E1）。","metrics":[{"m":"解析耗时","v":"实测 1.1s（MVP-1 口径）"},{"m":"解析准确率","v":"评测集 500+ 对话标注口径（PRD §7）"}],"trace":["AIP-025 需求解析","采购需求解析 MVP-1","chat_turn.parse 结构化留痕"],"ai":"把自然语言拆成品类、场景、预算、规格、品牌五个字段；听到「200 套单价 50 以内」时自动换算总价上限并带入检索，听不懂就明说。","process":["拆解品类 / 场景 / 预算 / 规格 / 品牌五要素。","「200 套单价 50 元以内」自动换算总价上限 1 万元（示意）并带入检索条件。","解析结果与依据回显给采购人确认。"],"highlights":["五要素 + 数量换算一次完成","解析留痕（chat_turn.parse），可复盘可评测"],"beforeAfter":[{"dim":"需求拆解","before":"人工拆词 + 计算器核价（示意）","after":"五要素自动解析、总价自动换算（实测 1.1s）"}],"h":90},{"id":"gx","laneIndex":2,"w":88,"x":508,"y":393,"kind":"diamond","title":"需求完整？","solves":[{"ref":"S2","how":"型号、口径等关键参数缺失时判「不完整」，宁可追问不瞎猜。"}],"legacy":"以前需求要素全不全没人检查，搜出来一堆再人工筛。","whyAi":"参数缺口（电梯型号、水泵口径）人工最容易漏，AI 按品类模板逐项核对。","humanRole":"采购人按提示补一两句即可，不用自查要素清单。","risks":[{"risk":"完备标准配得过严，句句追问惹人烦","guard":"只追问影响检索命中与合规的关键字段，其余缺省。"}],"fallback":"判断不了时按不完整处理，走追问确认。","metrics":[{"m":"追问触发率","v":"运营观测（按品类模板统计）"}],"trace":["AIP-025 解析完备性检查","品类关键参数模板","gx→g3 追问 / gx→s1 检索分流"],"ai":"对照品类参数模板检查五要素与关键参数：缺什么标记出来交给追问，齐备就直接进检索。","process":["对照品类模板核对五要素与关键参数。","缺关键字段转入多轮澄清；齐备直接进入检索。"],"highlights":["宁可追问不瞎猜，把「买错型号」拦在下单前"],"beforeAfter":[{"dim":"要素把关","before":"靠采购人自查，漏了才发现（示意）","after":"按品类模板自动核对，缺口必追问"}],"h":58},{"id":"g3","laneIndex":2,"w":190,"x":798,"y":377,"no":"03","title":"多轮澄清补齐条件","sub":"项目/收货地 · 预算归属/成本中心 · 型号参数 · 到货时间","aip":"AIP-026","panelTitle":"多轮澄清：缺什么问什么，凑齐结构化采购条件","solves":[{"ref":"S1","how":"活动物料品类杂，AI 按场景反问易漏品类与数量，凑成完整清单。"},{"ref":"S2","how":"追问电梯型号、水泵口径等关键参数，不用翻维保合同问工程师。"},{"ref":"S3","how":"确认项目归属与成本中心，预算校验有挂靠对象。"},{"ref":"S4","how":"补充「要有反光条」这类条件后，结果自动收敛且前几轮条件不丢。"}],"legacy":"以前缺口靠采购人自查：翻合同查型号、问财务查预算、问项目查收货地，一来一回好几天。","whyAi":"B2B 采购的关键条件（项目、预算归属、型号）分散在多个系统里，AI 按品类模板逐项追问比人记得全。","humanRole":"采购人只答问题不查系统；答案即条件，随话写入采购要求。","risks":[{"risk":"追问过多把对话变审问","guard":"只问影响检索与合规的关键字段，单会话轮次上限可配（默认 20 轮，PRD Q1）。"}],"fallback":"达到轮次上限时提示开新会话，历史会话仍可回顾（PRD AC-E3）。","metrics":[{"m":"多轮完成率","v":"多轮会话达成加购比例（PRD §7 口径）"}],"trace":["AIP-026 多轮对话","chat_turn 会话条件合并","项目 / 预算系统接口"],"ai":"按品类模板缺什么问什么：问收货地（「这批物资送往保利天悦项目，还是总部办公楼？」）、问预算归属（提示该项目本月预算余量并确认是否继续）、问型号参数与到货时间；补充条件并入前几轮会话条件一起重新解析。","process":["问项目与收货地：「这批物资是送往保利天悦项目，还是总部办公楼？」","确认预算归属：提示该项目本月预算余量（如「保洁耗材预算剩余约 3000 元，示意」，数字来自预算系统原值），确认是否继续。","追问电梯型号、水泵口径、数量、期望到货时间等关键字段。","补充条件并入会话条件重新解析，结果逐步收敛。"],"highlights":["B2B 关键维度（项目 / 成本中心 / 收货地 / 型号）进追问模板，集采强依赖的条件不缺位","预算余量提示来自系统原值，不做无依据承诺"],"beforeAfter":[{"dim":"条件补齐","before":"翻合同、问财务、问项目，一来一回数天（示意）","after":"关键字段 AI 追问，一次对话内补齐"}],"h":90},{"id":"s1","laneIndex":3,"col":3,"w":185,"x":1155,"y":528,"no":"04","title":"检索单位可售商品池","sub":"双路召回 · 目录与权限过滤 · 只出原值","aip":"AIP-025（检索执行）","solves":[{"ref":"S2","how":"按电梯型号等关键参数过滤可售商品，型号不匹配的进不了结果。"},{"ref":"C1","how":"价格、库存、协议价全部取检索原值，推荐层不可改写。"},{"ref":"C2","how":"仅在该单位 / 项目可见目录内检索，目录外商品不进结果。"}],"legacy":"以前检索结果全站混出，无权采、目录外商品混在列表里，采购人点进去才发现不可采。","whyAi":"语义检索兜住「写法不同但实际相近」的商品表达，型号类硬条件由结构化字段精确过滤。","humanRole":"采购人不再逐个点开核对「能不能采」——进清单的都是本单位可采的。","risks":[{"risk":"检索条件过严导致零结果","guard":"如实告知「没找到」并给放宽建议（如「去掉反光条要求有 5 款，示意」），不硬凑。"}],"fallback":"零结果转兜底建议与人工承接，禁止拿不匹配商品硬凑（PRD AC-E2）。","metrics":[{"m":"检索命中 · 零结果率","v":"运营观测（搜索日志口径）"}],"trace 收基线对齐 SOW 表 13（关键属性≥85% / 普通≥75% / 类目首选≥80% / 前三≥85% / 同款 P≥85%·R≥80% / 搜索前三≥95%·前十≥85% / 客服标准问答≥85%·高风险 100%）。",Fv={id:Gv,platform:Pv,title:$v,subtitle:Qv,scenarios:Yv,constraints:Vv,flow:Xv,compare:Kv,metricNote:Jv},Wv="ai-recommend",e2="搜索",t2="AI 猜你喜欢 · 场景融合演示",n2="围绕单位常购、相似商品与关联品类三个推荐场景，展示 AI 猜你喜欢如何在采购资格约束下完成召回、去重、排序、理由展示与反馈评估。",l2=[{id:"S1",name:"常买的东西，还得重新找",tag:"单位常购",kw:"复购",card:"月底整理补货单，常买的手套、护目镜就在历史订单里，采购人员却还是得重新搜、逐条核对规格。",story:{who:"月底，采购人员打开工作台，准备补齐本单位的常购品。",stuck:"他记得上次买过劳保手套，也记得大概的规格，却想不起具体 SKU 藏在哪张订单里。工作台如果只给全站热门榜，他还是得回到搜索框，从头找起。",consequences:["补货单上的商品要逐项重搜、核规格，时间花在找回旧订单上。","常买 SKU 藏在历史记录里，临时接手采购的人很难顺手找到。","新单位没有足够的历史订单时，系统也不能假装已经了解它的采购偏好。"]},solution:{who:"工作台优先展示本单位常买的品类和商品；买得有规律时，再提示大概什么时候该补货。新单位没有历史订单时，直接说明推荐来自哪里（例如类目热销），不假装了解它的采购偏好。",smooth:"采购打开页面，先看到有依据的“贵单位常购”清单，再结合本次项目和实际规格核对。个人行为数据不足时，不把单位统计包装成“系统懂你”。",effects:["常购品从历史订单走到工作台，减少反复翻旧单和重新搜索。","新接手的采购人员也能从本单位的常购记录入手，不必完全依赖口头交接。","历史不足时如实说明推荐来源，不用虚构的个人偏好填满推荐位。"]}},{id:"S2",name:"想比个相近款，还得来回翻页",tag:"相似商品",kw:"比选",card:"打开安全帽详情页后，采购人员想比较同规格或相近参数的备选商品，却还得返回结果页重新搜索。",story:{who:"采购人员点开一款安全帽或其他具体商品，正在核对规格、价格和供货条件。",stuck:"看完当前商品，他还想找一两款相近规格的商品放在一起比较；页面却没有可信的相似商品入口，只能退回搜索结果、换关键词，再逐个打开详情页。",consequences:["为了比较一两个关键规格，采购人员反复离开详情页、再回来定位。","同款或相近款分散在多个页面，规格差异不容易一眼看清。","如果推荐只因为标题相似、没核对关键属性，反而可能把不合适的商品带进比选清单。"]},solution:{who:"详情页以当前商品为起点，把同款的其他规格、关键参数相近的商品、写法不同但实际相近的商品找出来放在一起；自动排除当前商品和无权查看的商品。",smooth:"相似关系来自同款映射、标准属性和语义数据。推荐展示时说明具体依据，并保留有采购意义的规格、SKU 差异；资格和动态供货状态仍需按业务规则校验。",effects:["采购人员可以留在当前商品页查看有比较价值的备选项。","推荐理由能落到“同款关系”或具体属性匹配，而不是笼统地说“AI 觉得相似”。","去重只合并重复记录，不会把不同规格或可选 SKU 错误折叠掉。"]}},{id:"S3",name:"清单差一件，系统没给下一步",tag:"关联品类",kw:"关联采购",card:"购物车里已有劳保手套，采购人员想起可能还要配护目镜；零结果页却只显示“没有找到商品”，没有下一步提示。",story:{who:"采购人员正在收尾一张集中采购清单，或在检索某个商品时碰到了零结果。",stuck:"清单已经快齐了，他还得靠记忆回想有没有经常一起采购的品类；而搜索无结果时，页面也没有基于历史采购关系的备选提示，只能换词再搜。",consequences:["配套品类全靠人回忆，忙起来时容易忘记还有哪些项目需要确认。","为了补齐清单，采购人员又要换词搜索、切换页面，思路和操作被打断。","零结果页没有合理的下一步时，用户只能退出当前流程，或去其他地方继续找。"]},solution:{who:"购物车和零结果页会翻本单位过去的订单，看哪些品类经常一起买，据此给出搭配建议；只有订单里确实经常一起出现的搭配，才显示「贵单位采购这类商品时，也常采购……」这样的理由。",smooth:"「经常一起买」只是历史订单提供的线索，不代表这些商品必须成套购买。一起买的次数不够多时，这个推荐位直接不显示；如果展示的是热门商品，会明确说明这是热门推荐，而不是说成历史关联。",effects:["存在可靠历史关联时，采购人员可以在当前清单里顺手检查相关品类。","零结果页在有合适备选时提供继续浏览的路径，而不是只留下一个空状态。","统计证据不足时不乱推，避免把偶然同单说成必然搭配。"]}}],a2=[{id:"C1",name:"采购资格必须先于排序校验",kw:"采购资格",fullTitle:"采购资格必须先于排序校验【目录·权限·供应条件】",card:"相关度高不代表可以采购。推荐必须先核对当前单位与项目的目录权限、供应商资质及适用的价格、库存和配送条件。",reality:"个性化推荐不能授权用户采购无权限商品；目录、项目、供应商、价格与库存状态由各自的业务权威数据源提供。",decision:"把采购资格作为排序前的硬约束。无权、禁采或不满足硬性条件的备选必须剔除；价格、库存等动态状态在进入采购操作时按业务规则再次校验。",land:"落地在采购规则过滤、目录与权限数据供给、供应商准入规则，以及加购或提交采购时的业务校验。"},{id:"C2",name:"推荐理由必须有证据并可追溯",kw:"可解释",fullTitle:"推荐理由必须有证据并可追溯【理由来源·策略版本】",card:"采购人员需要知道为什么看到某个商品。推荐理由必须能够对应真实的历史采购、商品属性匹配或品类关联证据，不能由模型随意编造。",reality:"单一排序分数不足以支持采购核对；发生异常时，还需要在实际实现范围内定位推荐请求使用的理由、规则与策略。",decision:"优先采用可验证的理由码，并让理由与实际命中的数据来源对应。记录实际展示结果和已实现的策略标识；不把尚未实现的信号贡献度分解或不可篡改日志写成既有能力。",land:"落地在推荐结果组装、理由渲染、曝光与点击日志，以及已实现的策略版本和调用记录。"},{id:"C3",name:"单位数据隔离与推荐公平",kw:"数据隔离",fullTitle:"单位数据隔离与推荐公平【单位边界·无竞价置顶】",card:"单位采购画像不得越权流转到其他单位；推荐排序应依据与采购目标相关的规则，不由竞价推广或未经授权的人工置顶决定。",reality:"正式需求明确不做跨单位推荐，并且不做竞价推广位；单位常购和关联统计必须尊重租户/单位的数据边界。",decision:"单位画像和品类搭配统计按单位范围隔离；权限在数据访问与备选过滤层落实。排序规则应可说明、可复核，人工干预需有授权与记录。",land:"落地在单位画像和搭配统计数据模型、数据访问权限、备选过滤、策略配置与审计记录。"},{id:"C4",name:"成本、时延与降级必须可控",kw:"可用性",fullTitle:"成本、时延与降级必须可控【预算·超时·兜底】",card:"推荐服务需要控制计算成本与响应时间。画像或模型服务超时、备选不足时，应按场景策略安全降级，不能拖垮搜索、购物车和采购主流程。",reality:"规则检索、统计关联、向量检索和外部模型调用的成本结构不同；不能在缺乏调用数据时宣称全流程零成本或已达到确定的节约比例。",decision:"按实际实现拆分调用和资源成本，先用可复用数据与确定性规则；为超时、数据不足和服务不可用定义兜底或隐藏策略，并用监控数据验证效果。",land:"落地在召回与排序服务、超时控制、兜底策略、调用预算、成本监控和效果评测。"}],i2=JSON.parse('{"width":1360,"height":1037,"defaultSelected":"e4","lanes":[{"label":"用户 · 业务场景层","note":"页面入口 → 反馈与画像迭代闭环","tone":"biz","top":0,"height":191},{"label":"业务 · 数据供给层","note":"四类数据竖向供数","tone":"data","top":217,"height":119},{"label":"推荐中台 · 引擎层","note":"召回→融合→过滤→排序→展示","tone":"mid","top":362,"height":301},{"label":"数据治理层","note":"标准·权限·合规·审计·策略","tone":"ai","top":689,"height":119},{"label":"基础设施层","note":"算力与平台底座","tone":"bas  → LiteLLM 路由」：出域前脱敏、云端多 provider 互备、回来还原映射——一座桥，全公司共用。",smooth:"业务请求 → 域内预检（域内能答不出域）→ 敏感字段脱敏 → LiteLLM 路由云端 → 回包还原映射——数据出去了，敏感值没出去。",effects:["云端模型用上了，敏感数据没出去——两个世界安全并存的唯一通道","网关唯一收口：没有第二条出域路，影子 API 无处遁形","前期零 GPU 投入——账单按次，随业务量伸缩"]}},{id:"S2",name:"云端断了怎么办",tag:"断不了",kw:"互备",card:"单一云供应商一旦超时/限流/停服，属性抽取停线、客服降级、搜索理解退化——把全部 AI 能力押在一个外部依赖上，等于把命脉交出去。",story:{who:"依赖云端模型的三条业务流水线（抽取/搜索/客服）。",stuck:"云服务商超时、限流、区域故障——不是会不会的问题，是什么时候的问题。",consequences:["抽取停线：商品上架链路堆积，供应商等待","客服降级：FAQ 检索之外全部转人工，队列暴涨","单供应商锁定：议价无筹码，涨价只能受着"]},solution:{who:"LiteLLM 网关统一路由多 provider（GLM/Qwen/OpenAI 已验证〔实测〕）：单家故障自动切换，全断则按敏感度分级降级——fail-closed 而非 fail-open。",smooth:"请求进网关 → 主 provider 健康 → 直发；异常 → 自动切备选；全不可用 → 敏感场景关闭出域、转人工/规则兜底——降级是设计出来的，不是临时救火。",effects:["单家故障无感切换——流水线不停","全断有预案：关闭出域保安全，规则与人工保业务底线","多 provider 常态在网——议价有筹码，不被锁死"]}},{id:"S3",name:"出域了什么说不清",tag:"可审计",kw:"留痕",card:"监管或内审问：过去一年，什么数据、在什么场景、发给了哪个模型？——答不上来就是合规缺口。出域不可追溯，等于每次调用都在裸奔。",story:{who:"安全与合规团队需要回答「数据出域全貌」。",stuck:"调用分散在各业务代码里时，出域记录也散在各处——拼不出全景，也证明不了「敏感值没出去」。",consequences:["审计要逐系统翻日志——成本高还拼不全","无法自证清白：说「脱敏了」，拿不出证据链","事故追责无据——哪次调用漏了脱敏，查不出来"]},solution:{who:"网关唯一收口自带全量审计：每次出域记录「谁、何时、何场景、发给了哪个模型、脱敏了哪些字段」——一张表回答全部审计问题。",smooth:"调用过网关 → 结构化审计日志（脱敏前后摘要、provider、耗时、结果）→ 审计报表直出——出域全貌一张表。",effects:["审计从「翻系统」变「查一张表」——全景分钟级拼出","自证清白有据：每次调用的脱敏证据链完整","漏脱敏可定位：按字段级日志追到具体调用"]}}],Ay=[{id:"C1",name:"数据不出域——脱敏后走云端",kw:"不出域",fullTitle:"数据不出域【脱敏后走云端】",card:"商品、价格、供应商、订单数据绝不可出内网。SOW 约束一允许「私有化部署或脱敏网关」双路径；前期（ADR-014）不部署本地大模型——模型能力全部经脱敏网关调用云端，数据存储全内网。",reality:"数据出域即是安全事故；而前期 GPU 采购与私有化投入不成立（ADR-014）。",decision:"前期纯云端：LiteLLM 网关统一调度云端大模型（GLM/Qwen 等，多 provider 互备），出域必经脱敏网关，敏感场景 fail-closed 拒绝；私有化留作后期再评估（云端账单超私有化 TCO 交叉点 / 强制本地推理合规 / UIE 蒸馏学生模型达标）。",land:"落地在本页全链路：02 域内预检 → 03 脱敏 → 04 云端路由 → 07 审计——网关是出域唯一通道。"},{id:"C2",name:"AI 按次收费——不能全量用",kw:"钱",fullTitle:"AI 按次收费【不能全量用】",card:"网关层同样要省钱：重复问题（同商品同 prompt）缓存复用、域内能答的不出域、低价值调用限流——网关既是安全闸也是成本闸。",reality:"按次计费叠加多业务调用，无治理的网关会变成账单放大器。",decision:"三层成本闸：域内预检拦截（零成本）、语义缓存复用（同问不重付费）、按业务配额限流——省钱不牺牲安全。",land:"落地在环节 02「域
