/* ============ 泳道 SVG 布局 ============ */
const LANES = [
  {y:64,  h:88,  name:'供应商侧',      bg:'#eef1f5'},
  {y:160, h:168, name:'AI 商品中台',   bg:'#fdf5f0'},
  {y:336, h:100, name:'AI 搜索中台',   bg:'#fdf5f0'},
  {y:446, h:82,  name:'采购侧 · 交易', bg:'#eef1f5'},
  {y:536, h:112, name:'AI 客服中台',   bg:'#fdf5f0'},
  {y:656, h:100, name:'数据底座',      bg:'#f2f3f5'}
];
/* 节点坐标 [x, y, w]（统一 h=66；n10 为横条） */
const POS = {
  n1:[168,75,170], n2:[180,196,170], n3:[390,196,220], n4:[640,196,170],
  n5:[640,352,170], n6:[910,352,170], n7:[910,458,170],
  n8:[1070,576,170], n9:[1280,576,170], n10:[180,690,1180,44]
};
function laneSvg(){
  let s = '';
  LANES.forEach(l=>{
    s += `<rect x="120" y="${l.y}" width="1350" height="${l.h}" fill="${l.bg}" stroke="#e3e6ea"/>`;
    s += `<text x="134" y="${l.y+24}" font-size="13" font-weight="700" fill="#6b7683">${l.name}</text>`;
  });
  /* 主流程箭头（橙实线） */
  const flows = [
    'M253,141 L258,196',      /* 01 推品 → 02 审核 */
    'M350,229 L390,229',      /* 02 → 03 */
    'M610,229 L640,229',      /* 03 → 04 */
    'M725,262 L725,352',      /* 04 池 → 05 检索（纵向） */
    'M810,385 L910,385',      /* 05 → 06 */
    'M995,418 L995,458',      /* 06 → 07 交易（纵向） */
    'M995,524 C995,558 1050,568 1120,576', /* 07 → 08 客服 */
    'M1240,609 L1280,609'     /* 08 → 09 */
  ];
  flows.forEach(d=> s += `<path d="${d}" fill="none" stroke="#FC773F" stroke-width="2.4" marker-end="url(#ar)"/>`);
  /* 回流虚线（灰） */
  s += `<path d="M1370,576 C1370,330 950,250 816,235" fill="none" stroke="#9aa4b0" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#ar2)"/>`;
  s += `<text x="1030" y="290" font-size="10.5" fill="#8a94a6">客服坏案例 · 行为日志回流 → 知识库 / 治理 / 词库</text>`;
  s += `<path d="M1370,642 L1370,690" fill="none" stroke="#9aa4b0" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#ar2)"/>`;
  /* 供应商来源标注 */
  s += `<text x="356" y="105" font-size="10.5" fill="#8a94a6">京东 API · 震坤行 ZKH · 集采目录 · 批量导入</text>`;
  /* 底座支撑说明 */
  s += `<text x="750" y="682" font-size="11" fill="#98a0aa" text-anchor="middle">底座四件套（数据 · 模型 · 规则 · 评测）向上支撑三大中台——每个环节"跑在什么技术上"见点击详情的追溯链 ↑</text>`;
  /* 节点 */
  for(const [id,p] of Object.entries(POS)){
    const n = NODES[id];
    if(id==='n10'){
      s += `<g class="node" onclick="openPanel('n10')">
        <rect class="card" x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[3]}" rx="22" fill="#fff" stroke="#FC773F" stroke-width="1.8"/>
        <circle cx="${p[0]+26}" cy="${p[1]+22}" r="13" fill="#FC773F"/><text x="${p[0]+26}" y="${p[1]+26}" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">10</text>
        <text x="${p[0]+52}" y="${p[1]+27}" font-size="13" font-weight="600" fill="#D95F2B">数据回流飞轮 —— 搜索日志 · 订单行为 · 客服坏案例 · 审核记录 → 词库/排序/知识库/评测集持续生长（点击看四维对比）</text></g>`;
      continue;
    }
    s += `<g class="node" onclick="openPanel('${id}')">
      <rect class="card" x="${p[0]}" y="${p[1]}" width="${p[2]}" height="66" rx="10" fill="#fff" stroke="#d8dce2" stroke-width="1.6"/>
      <circle cx="${p[0]+22}" cy="${p[1]+20}" r="12" fill="#FC773F"/><text x="${p[0]+22}" y="${p[1]+24}" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">${n.no}</text>
      <text x="${p[0]+42}" y="${p[1]+24}" font-size="13" font-weight="700" fill="#2c3e50">${n.name}</text>
      <text x="${p[0]+16}" y="${p[1]+46}" font-size="10.5" fill="#98a0aa">${n.caps}</text>
      <text x="${p[0]+16}" y="${p[1]+60}" font-size="9.5" fill="#b8bfc8">点击：场景/约束 · AI 做了什么 · 怎么解决 · 前后对比</text></g>`;
  }
  return s;
}
function renderLane(){
  document.getElementById('lane').innerHTML = `
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#FC773F"/></marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#9aa4b0"/></marker>
  </defs>
  <text x="750" y="34" font-size="16" font-weight="700" text-anchor="middle" fill="#333">业务全景泳道：供应商 → 商品中台（治理）→ 搜索中台（发现）→ 采购交易 → 客服中台（守护）→ 底座（支撑 + 飞轮）</text>
  ${laneSvg()}`;
}

/* ============ 详情面板（四段式 + 追溯链） ============ */
function openPanel(id){
  const n = NODES[id];
  document.getElementById('panelBody').innerHTML = `
    <h2>${n.no} · ${n.name}</h2>
    <div class="sub">泳道：${n.lane} ｜ 业务能力编号：${n.caps}</div>
    <div class="seg"><h4>① 场景与约束</h4><p>${n.scene}</p></div>
    <div class="seg alt"><h4>② AI 做了什么</h4><p>${n.what}</p></div>
    <div class="seg"><h4>③ 怎么解决（机制与技术锚点）</h4><p>${n.how}</p></div>
    <div class="seg alt"><h4>④ 前后对比（人力 / 时间 / 金钱 / 数据）</h4><p>${n.cmp}</p></div>
    <div class="trace"><h4>追溯链（业务场景 → 业务能力 → 技术组件 → 技术锚点，对齐 model.yaml RTM；反向即"被服务"）</h4>
      <div>${n.trace.s.map(x=>`<span class="chip c1">${x}</span>`).join('')}</div>
      <div>${n.trace.cap.map(x=>`<span class="chip c2">${x}</span>`).join('')}</div>
      <div>${n.trace.comp.map(x=>`<span class="chip c2">${x}</span>`).join('')}</div>
      <div>${n.trace.tech.map(x=>`<span class="chip c3">${x}</span>`).join('')}</div>
    </div>
    <div class="src">口径说明：〔实测〕= STATUS.md 已验证数字；〔设计目标〕= 方案 v2 口径，评测基线锁定后以 A/B 复核。完整链路见 architecture/model.yaml 与 00-追溯矩阵.md（生成物，勿手改）。</div>`;
  document.getElementById('panel').classList.add('on');
  document.getElementById('mask').style.display = 'block';
}
function closePanel(){
  document.getElementById('panel').classList.remove('on');
  document.getElementById('mask').style.display = 'none';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });

/* ============ 渲染 ============ */
function renderCmp(){
  let h = `<tr><th class="dim">维度</th>${CMP.cols.map(c=>`<th>${c}</th>`).join('')}</tr>`;
  CMP.rows.forEach(r=>{
    h += `<tr><td class="dim">${r.dim}</td>${r.cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
  });
  document.getElementById('cmpTable').innerHTML = h;
}
renderLane(); renderCmp();
</script>
