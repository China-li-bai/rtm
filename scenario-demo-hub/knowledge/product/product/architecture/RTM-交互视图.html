/* ---------- 归属推导：能力→中台 ---------- */
function capPlatform(cap){
  const m = cap.match(/^(AIP|AICS)-(\d+)/);
  if(!m) return '商品';
  if(m[1]==='AICS') return '客服';
  return parseInt(m[2]) <= 14 ? '商品' : '搜索';
}
function compPlatform(compId){
  const caps = DATA.rows.filter(r=>r.comp===compId);
  const cnt = {};
  caps.forEach(r=>{ const p = capPlatform(r.cap); cnt[p]=(cnt[p]||0)+1; });
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
}
const PLATS = ['商品','搜索','客服'];
const PCOLOR = { '商品':'#FC773F', '搜索':'#D95F2B', '客服':'#44546A' };
const PNAME  = { '商品':'AI 商品中台','搜索':'AI 搜索中台','客服':'AI 客服中台' };

function platStats(p){
  const rows = DATA.rows.filter(r=>capPlatform(r.cap)===p);
  const comps = [...new Set(rows.map(r=>r.comp))];
  const acs = rows.reduce((a,r)=>a+(r.ac||0),0);
  let n=0; rows.forEach(r=>{ const m=r.cap.match(/^(AIP|AICS)-(\d+)(?:-(\d+))?$/); if(m) n += m[3]? parseInt(m[3])-parseInt(m[2])+1 : 1; });
  return { rows, comps, acs, n };
}

    return `

/* ---------- L3 组件卡片 ---------- */
function hl(t){
  if(!kw) return t;
  const i = t.toLowerCase().indexOf(kw);
  if(i<0) return t;
  return t.slice(0,i)+'<mark>'+t.slice(i,i+kw.length)+'</mark>'+t.slice(i+kw.length);
}
function l3(p){
  const s = platStats(p);
  const scens = [...new Set(s.rows.flatMap(r=>r.scenarios))];
  const compIds = [...new Set(s.rows.map(r=>r.comp))];
  const cards = compIds.map(cid=>{
    const rows = DATA.rows.filter(r=>r.comp===cid);
    const c = DATA.components[cid];
    const tech = [...new Set(rows.flatMap(r=>r.tech))];
    const match = !kw || (cid+rows.map(r=>r.cap+r.name).join('')+tech.join(' ')).toLowerCase().includes(kw);
    if(!match) return '';
    return `<div class="comp${c.legacy?' legacy':''}">
      <h3><span class="cid">${cid}</span>${c.legacy?rows[0].comp+' 组件（存量文档承载）':hl(c.card.split('/').pop().replace('.md',''))}</h3>
      <div class="caps">${rows.map(r=>`<span title="${r.name}">${r.cap} ${hl(r.name)}</span>`).join('')}</div>
      <div class="tech"><b>技术锚点 ${tech.length}：</b>${tech.map(hl).join('；')}</div>
      <div class="foot">
        <span>FR ${rows.reduce((a,r)=>a+(r.fr||0),0)||'—'} · AC ${rows.reduce((a,r)=>a+(r.ac||0),0)||'存量卡内'}</span>
        ${c.card?`<a href="../${c.card}">PRD 卡 ↗</a>`:''}
      </div></div>`;
  }).join('');
  return `<div class="plat-head">
      <h2 style="color:${PCOLOR[p]}">${PNAME[p]}</h2>
      <span style="color:#98a0aa;font-size:12px">${{ '商品':'上游 · 把货变标准','搜索':'下游 · 让人找到货','客服':'贯穿 · 守护成交' }[p]}</span>
      <span class="scen">服务场景：${scens.map(x=>`<b>${x} ${DATA.scenarios[x].name}</b>`).join('')}</span>
      <span style="font-size:12px;color:#98a0aa">${s.n} 项能力 · ${s.comps.length} 组件 · ${s.acs} 验收用例</span>
    </div><div class="cards">${cards}</div>`;
}

/* ---------- 导航 ---------- */
function go(l, p){
  level = l; if(p!==undefined) focus = p;
  $('l3').style.display = level===3 ? 'block' : 'none';
  $('stage').style.display = level===3 ? 'none' : 'block';
  $('hint').style.display = level===3 ? 'none' : 'block';
  $('crumb').innerHTML = `<span class="lvl" onclick="go(1)">L1 全景</span>` +
    (level>=2?`<span class="sep">›</span><span class="lvl" onclick="go(2)">L2 容器</span>`:'') +
    (level===3?`<span class="sep">›</span><b>L3 ${PNAME[focus]}</b>`:'') +
    `<span class="sep" style="margin-left:14px">·</span><span style="color:#9aa4b0">${DATA.rows.reduce((a,r)=>a+(r.ac||0),0)} 验收用例 · ${Object.keys(DATA.components).length} 组件 · ${DATA.rows.reduce((a,r)=>a+r.tech.length,0)} 锚点</span>`;
  if(level===1){ $('stage').innerHTML = `<div class="svgbox">${l1()}</div>`; }
  if(level===2){ $('stage').innerHTML = `<div class="svgbox">${l2()}</div>`; }
  if(level===3){ $('l3').innerHTML = l3(focus); window.scrollTo(0,0); }
}
$('q').addEventListener('input', e=>{ kw = e.target.value.trim().toLowerCase(); if(level===3) $('l3').innerHTML = l3(focus); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ go(level===3?2:1); } });
go(1);
</script>
